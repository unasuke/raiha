on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake test:unit

  steep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rbs collection install
      - run: bundle exec steep check --group=next

  next-interop-openssl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake test:next:interop:openssl

  next-interop-picotls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev
      - run: bundle exec rake test:next:interop:picotls

  next-interop-quicgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'
          cache-dependency-path: test/support/quicgo/go.sum
      - run: bundle exec rake test:next:interop:quicgo

  next-interop-aioquic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: bundle exec rake test:next:interop:aioquic

  next-interop-quic-gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential
      - run: bundle exec rake test:next:interop:quic_gem

  next-interop-h3i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: git clone --depth 1 https://github.com/cloudflare/quiche.git tmp/quiche
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            tmp/quiche
            test/support/h3i_harness -> ../../../tmp/h3i_harness
      - run: bundle exec rake test:next:interop:h3i

  next-interop-quiche-http3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: git clone --depth 1 https://github.com/cloudflare/quiche.git tmp/quiche
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: tmp/quiche
      - run: bundle exec rake test:next:interop:quiche_http3_client test:next:interop:quiche_http3_server

  next-interop-h3spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake test:next:interop:h3spec

  next-qifs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: bundle exec rake test:next:qifs

  next-interop-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # Wireshark >= 4.5.0 for the trace checks.
      - run: |
          sudo add-apt-repository ppa:wireshark-dev/nightly
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tshark
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: git clone --depth 1 https://github.com/quic-interop/quic-interop-runner tmp/quic-interop-runner
      - run: |
          python -m pip install --upgrade pip
          pip install -r tmp/quic-interop-runner/requirements.txt
      - run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("tmp/quic-interop-runner/implementations_quic.json")
          impls = json.loads(p.read_text())
          impls["raiha-next"] = {
              "image": "localhost/raiha-next-interop:latest",
              "url": "https://github.com/unasuke/raiha",
              "role": "both",
          }
          p.write_text(json.dumps(impls, indent=2))
          PY
      - run: docker build -t localhost/raiha-next-interop:latest -f interop/Dockerfile .
      # versionnegotiation is left out: the runner does not list it among
      # its testcases, and its check fails on every trace (interop/README.md).
      - run: >-
          interop/run_interop_runner.sh -c raiha-next -s raiha-next
          -t handshake,transfer,multiplexing,retry,chacha20,keyupdate,http3,resumption,zerortt
          --log-dir logs -j result.json -d
      # The runner skips a pair that is not compliant and fails nothing for a
      # testcase left unsupported: each has to have succeeded.
      - working-directory: tmp/quic-interop-runner
        run: |
          python - <<'PY'
          import json, sys
          results = json.load(open("result.json"))["results"][0]
          print(results)
          failed = [result["name"] for result in results if result["result"] != "succeeded"]
          sys.exit(f"not succeeded: {failed}" if failed else 0)
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quic-interop-runner-next-logs
          path: tmp/quic-interop-runner/logs
          retention-days: 7
