on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake test:unit

  steep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rbs collection install
      - run: bundle exec steep check

  interop-openssl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake test:interop:openssl

  interop-picotls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev
      - run: bundle exec rake test:interop:picotls

  interop-quicgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: test/support/quicgo/go.mod
          cache-dependency-path: test/support/quicgo/go.sum
      - run: bundle exec rake test:interop:quicgo

  interop-aioquic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: bundle exec rake test:interop:aioquic

  interop-quic-gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential
      - run: bundle exec rake test:interop:quic_gem

  interop-h3i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: git clone --depth 1 https://github.com/cloudflare/quiche.git tmp/quiche
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            tmp/quiche
            test/support/h3i_harness -> ../../../tmp/h3i_harness
      - run: bundle exec rake test:interop:h3i

  interop-quiche-http3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: git clone --depth 1 https://github.com/cloudflare/quiche.git tmp/quiche
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tmp/quiche
      - run: bundle exec rake test:interop:quiche_http3_client test:interop:quiche_http3_server

  interop-h3spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake test:interop:h3spec

  qifs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: bundle exec rake test:qifs

  interop-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Wireshark >= 4.5.0 for the trace checks.
      - run: |
          sudo add-apt-repository ppa:wireshark-dev/nightly
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tshark
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: git clone --depth 1 https://github.com/quic-interop/quic-interop-runner tmp/quic-interop-runner
      - run: |
          python -m pip install --upgrade pip
          pip install -r tmp/quic-interop-runner/requirements.txt
      - run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("tmp/quic-interop-runner/implementations_quic.json")
          impls = json.loads(p.read_text())
          impls["raiha"] = {
              "image": "localhost/raiha-interop:latest",
              "url": "https://github.com/unasuke/raiha",
              "role": "both",
          }
          p.write_text(json.dumps(impls, indent=2))
          PY
      - run: docker build -t localhost/raiha-interop:latest -f interop/Dockerfile .
      # versionnegotiation is left out: the runner does not list it among
      # its testcases, and its check fails on every trace (interop/README.md).
      - run: >-
          interop/run_interop_runner.sh -c raiha -s raiha
          -t handshake,transfer,multiplexing,retry,chacha20,keyupdate,http3,resumption,zerortt
          --log-dir logs -j result.json -d
      # The runner skips a pair that is not compliant and fails nothing for a
      # testcase left unsupported: each has to have succeeded.
      - working-directory: tmp/quic-interop-runner
        run: |
          python - <<'PY'
          import json, sys
          results = json.load(open("result.json"))["results"][0]
          print(results)
          failed = [result["name"] for result in results if result["result"] != "succeeded"]
          sys.exit(f"not succeeded: {failed}" if failed else 0)
          PY
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quic-interop-runner-logs
          path: tmp/quic-interop-runner/logs
          retention-days: 7
